# Testing Workflow
#
# Purpose: Runs automated tests on all pushes and pull requests to ensure code quality.
#
# This workflow:
# - Triggers on all pushes and pull requests to any branch
# - Sets up Ruby 3.2.1 environment
# - Installs project dependencies using Bundler
# - Runs the test suite using the default Rails test command
#
# Requirements:
# - None (no secrets required for testing)

name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: simple_survey_tool_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Set up database
        env:
          RAILS_ENV: test
          DATABASE_URL: mysql2://root:password@127.0.0.1:3306/simple_survey_tool_test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: mysql2://root:password@127.0.0.1:3306/simple_survey_tool_test
        run: bundle exec rspec
