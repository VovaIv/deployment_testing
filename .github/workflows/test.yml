name: Rails CI

on:
  push:
    branches: 
      - '*'
  pull_request:
    branches: 
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:3.2.1-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            build-essential \
            libpq-dev \
            default-libmysqlclient-dev \
            pkg-config \
            nodejs \
            npm \
            curl \
            unzip

      - name: Install Bundler and dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Set up database
        env:
          RAILS_ENV: test
        run: |
          cp config/database.yml.ci config/database.yml
          bin/rails db:create db:schema:load

      - name: Run RSpec (non-JS system tests)
        env:
          RAILS_ENV: test
        run: |
          # Run all specs EXCEPT JS-enabled ones
          bundle exec rspec --tag ~js
